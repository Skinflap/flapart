name: Build and test native macOS source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-source:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            jobs: 3
          - runner: macos-15
            jobs: 2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact source and isolated SDK
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          git init "$RUNNER_TEMP/flapart-upstream"
          git -C "$RUNNER_TEMP/flapart-upstream" fetch --depth=1 https://invent.kde.org/graphics/krita.git bd6e8d061d2f0388c5b10278786cf0fe62e3135f
          git -C "$RUNNER_TEMP/flapart-upstream" checkout --detach FETCH_HEAD
          python3 native/scripts/prepare-fork.py "$RUNNER_TEMP/flapart-upstream"
          python3 native/qa/macos-build/fetch-dependencies.py --prefix "$RUNNER_TEMP/flapart-sdk" --cache "$RUNNER_TEMP/flapart-sdk-downloads"
          python3 -c 'import os, pathlib, shutil; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"flapart-sdk-downloads"; shutil.rmtree(p)'
      - name: Compile full painting application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-result
          python3 native/qa/macos-build/build.py --source "$RUNNER_TEMP/flapart-upstream" --prefix "$RUNNER_TEMP/flapart-sdk" --build "$RUNNER_TEMP/flapart-build" --jobs ${{ matrix.jobs }} 2>&1 | tee qa-result/build.log
      - name: Verify native artwork and separate Krita settings
        run: python3 native/qa/macos-build/test-compiled.py --prefix "$RUNNER_TEMP/flapart-sdk" --probe native/qa/portable --output qa-result/runtime
      - name: Package and test relocation without SDK fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 native/qa/macos-build/package-candidate.py --source "$RUNNER_TEMP/flapart-upstream" --prefix "$RUNNER_TEMP/flapart-sdk" --output "$RUNNER_TEMP/flapart-packaged" 2>&1 | tee qa-result/package.log
          cp "$RUNNER_TEMP/flapart-packaged/candidate-inventory.json" qa-result/candidate-inventory.json
          python3 native/qa/portable/test-relocated.py --candidate "$RUNNER_TEMP/flapart-packaged/Flapart Studio.app" --probe native/qa/portable --output qa-result/relocated --previous-qualification qa-result/runtime/qualification.json
      - name: Retain source-build evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compiled-${{ matrix.runner }}-evidence
          path: |
            qa-result/build.log
            qa-result/package.log
            qa-result/candidate-inventory.json
            qa-result/runtime/*
            qa-result/relocated/runtime/*
          retention-days: 7
          if-no-files-found: warn
