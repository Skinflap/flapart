name: Native macOS qualification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/plugin/**', 'native/qa/portable/**', 'ci/**', '.github/workflows/native-macos.yml']
permissions:
  contents: read
jobs:
  official-engine-studio:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test native painting and Studio workflow
        run: python3 ci/macos_runtime.py
      - name: Retain bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.runner }}-evidence
          path: qa-result/
          retention-days: 7
          if-no-files-found: warn
